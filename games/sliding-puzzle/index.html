<link rel="stylesheet" href="games/sliding-puzzle/style.css" />

<section class="sliding-puzzle">

  <button class="back-btn" onclick="history.back()">← Back</button>

  <h2>🧩 Sliding Puzzle</h2>

  <p class="status">
    Moves: <span id="moves">0</span> |
    Time: <span id="time">0</span>s
  </p>

  <div class="grid" id="grid"></div>

  <button id="restart">🔄 Restart</button>

  <!-- WIN MODAL -->
  <div id="winModal" class="modal hidden">
    <div class="modal-box">
      <h3>🎉 Puzzle Solved!</h3>
      <p id="resultText"></p>
      <p id="bestText"></p>
      <button onclick="restartGame()">Play Again</button>
    </div>
  </div>

</section>

<script src="games/sliding-puzzle/game.js"></script>
