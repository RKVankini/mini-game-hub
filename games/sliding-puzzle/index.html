<link rel="stylesheet" href="games/sliding-puzzle/style.css" />

<section class="sliding-puzzle">

  <button class="back-btn" onclick="loadHome()">← Back</button>

  <h2>🧩 Image Sliding Puzzle</h2>

  <!-- CONTROLS -->
  <div class="controls">
    <label>
      Grid:
      <select id="gridSize">
        <option value="3">3 × 3</option>
        <option value="4">4 × 4</option>
      </select>
    </label>
  </div>

  <!-- IMAGE PREVIEW -->
  <div class="preview-box">
    <p>Assemble this image 👇</p>
    <img id="previewImage" />
  </div>

  <p class="status">
    Moves: <span id="moves">0</span> |
    Time: <span id="time">0</span>s
  </p>

  <!-- GAME GRID -->
  <div class="grid" id="grid"></div>

  <button id="restart">🔄 Restart</button>

  <!-- WIN MODAL -->
  <div id="winModal" class="modal hidden">
    <div class="modal-box">
      <h3>🎉 Puzzle Solved!</h3>
      <p id="resultText"></p>
      <button id="playAgain">Play Again</button>
    </div>
  </div>

</section>
