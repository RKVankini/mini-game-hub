<link rel="stylesheet" href="games/quiz/style.css" />

<section class="quiz-game">
  <h2>❓ Quiz Game</h2>

  <!-- CATEGORY -->
  <div id="categoryBox">
    <button data-cat="devops">☁️ DevOps</button>
    <button data-cat="technical">💻 Technical</button>
    <button data-cat="fun">🎉 Fun</button>
  </div>

  <!-- QUIZ -->
  <div id="quizBox" class="hidden">
    <p id="question"></p>
    <div id="options"></div>

    <p>
      Question <span id="current">1</span> /
      <span id="total">1</span>
    </p>

    <button id="nextBtn">Next</button>
  </div>
</section>
