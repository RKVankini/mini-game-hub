<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz Game</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container" role="main">
    <button class="back-btn" onclick="history.back()" aria-label="Back to hub">← Back</button>
    <h1>❓ Quiz Game</h1>

    <section id="categoryBox" aria-label="Categories">
      <button class="category" data-type="devops">☁️ DevOps</button>
      <button class="category" data-type="technical">💻 Technical</button>
      <button class="category" data-type="fun">🎉 Fun</button>
      <button class="category" data-type="dadjokes">😂 Dad Jokes</button>
<button class="category" data-type="mulesoft">🔗 MuleSoft</button>

    </section>

    <section id="difficultyBox" class="hidden" aria-hidden="true">
      <button class="difficulty">Easy</button>
      <button class="difficulty">Medium</button>
      <button class="difficulty">Hard</button>
    </section>

    <section id="quizBox" class="hidden" aria-hidden="true">
      <div class="progress"><div id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div></div>
      <p id="question" class="question" aria-live="polite"></p>
      <div id="options" class="options" role="list"></div>
      <p class="info">⏱️ <span id="time">0</span>s | ⭐ Score: <span id="score">0</span></p>
      <p id="explanation" class="explanation hidden" aria-hidden="true"></p>
      <button id="nextBtn" disabled class="btn">Next</button>
    </section>

    <section id="resultBox" class="hidden" aria-hidden="true">
      <h2>🎉 Quiz Completed</h2>
      <p>Your Score: <span id="finalScore"></span></p>
      <p id="bestScore"></p>
      <button id="restartQuiz" class="btn">Play Again</button>
    </section>
  </main>

  <script src="./game.js" defer></script>
</body>
</html>
