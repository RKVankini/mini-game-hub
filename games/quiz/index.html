<link rel="stylesheet" href="games/quiz/style.css" />

<section class="quiz-game">
  <h2>❓ Quiz Game</h2>

  <div id="quiz-box">
    <p id="question">Question text</p>

    <div id="options"></div>

    <p class="info">
      Time: <span id="time">10</span>s |
      Score: <span id="score">0</span>
    </p>

    <button id="nextBtn" disabled>Next</button>
  </div>

  <div id="result" class="hidden">
    <h3>🎉 Quiz Finished!</h3>
    <p>Your Score: <span id="finalScore"></span></p>
    <button id="restartQuiz">🔄 Restart Quiz</button>
  </div>
</section>
