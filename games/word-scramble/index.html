<section class="game word-scramble">

  <h2>🔀 Word Scramble</h2>

  <div class="level-select">
    <button data-level="easy">😊 Easy</button>
    <button data-level="medium">😃 Medium</button>
    <button data-level="hard">🤓 Hard</button>
  </div>

  <p class="progress">
    Word <span id="round">1</span> / 10
  </p>

  <img id="wordImage" class="word-image" />

  <div class="game-box">
    <h1 id="scrambledWord">----</h1>

    <input id="userInput" placeholder="Type the correct word" />

    <div class="buttons">
      <button id="checkBtn">Check</button>
      <button id="nextBtn">Next</button>
    </div>

    <p id="message"></p>

    <div class="stars" id="stars"></div>
  </div>

  <div class="teacher">
    <button id="teacherBtn">👩‍🏫 Teacher Mode</button>
    <textarea id="teacherInput" placeholder="cat, dog, sun"></textarea>
    <button id="applyWords">Apply Words</button>
  </div>

</section>
