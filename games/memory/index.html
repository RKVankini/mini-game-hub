<link rel="stylesheet" href="games/memory/style.css" />

<section class="memory-game">
  <h2>🧠 Memory Game</h2>

  <select id="level">
    <option value="4">Easy (4×4)</option>
    <option value="6">Hard (6×6)</option>
  </select>

  <p class="status">
    Moves: <span id="moves">0</span> |
    Time: <span id="time">0</span>s
  </p>

  <div class="grid" id="grid"></div>

  <button class="restart" id="restart">🔄 Restart</button>
</section>
